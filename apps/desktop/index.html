<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkBee</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f7f7f7;
      }

      #startup-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f7f7;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease;
      }

      #startup-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #startup-splash img {
        width: 112px;
        height: 112px;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-splash" aria-label="WorkBee 正在加载">
      <img src="/logo.png" alt="WorkBee" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
